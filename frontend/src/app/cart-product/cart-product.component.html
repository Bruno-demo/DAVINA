<div class="product-container">
  <div class="product">
    <div class="product-image">
      <img [src]="product.image_url" [alt]="product.p_name" loading="lazy" />
    </div>
    <div class="product-info">
      <h3>{{ product.p_name }}</h3>
      <p>{{ product.price | currency:'RWF':'symbol':'1.0-0' }}</p>
      <div class="quantity-controls">
        <button (click)="decreaseQuantity()" >-</button>
        <span>{{ quantity }}</span>
        <button (click)="increaseQuantity()" [disabled]="atStockLimit" [class.disabled]="atStockLimit">+</button>
      </div>
      <div class="out-of-stock-msg" *ngIf="outOfStockMsg">
        <i class="fa-solid fa-circle-exclamation"></i> Out of stock
      </div>
    </div>
    <div class="product-price">
      <p>{{ product.price * quantity | currency:'RWF':'symbol':'1.0-0' }}</p>
      <i class="fa-solid fa-trash remove-btn" (click)="removeItem()" role="button"></i>
    </div>
  </div>
</div>
